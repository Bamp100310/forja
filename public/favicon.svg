<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Placa base de acero forjado -->
  <rect width="32" height="32" rx="4" fill="#0b1311"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="3.5" stroke="#254236" stroke-width="1.5"/>
  <rect x="2" y="2" width="28" height="28" rx="2.5" stroke="#101c18" stroke-width="1"/>

  <!-- Tachuelas / remaches de latón dorado en esquinas -->
  <circle cx="3.5" cy="3.5" r="1.2" fill="#d6a443" stroke="#443113" stroke-width="0.5"/>
  <circle cx="28.5" cy="3.5" r="1.2" fill="#d6a443" stroke="#443113" stroke-width="0.5"/>
  <circle cx="3.5" cy="28.5" r="1.2" fill="#80581a" stroke="#2a1d0b" stroke-width="0.5"/>
  <circle cx="28.5" cy="28.5" r="1.2" fill="#80581a" stroke="#2a1d0b" stroke-width="0.5"/>

  <!-- Yunque base de forja (silueta industrial) -->
  <path d="M5 22H27V26H5V22Z" fill="#1b3a27"/>
  <path d="M9 18H23V22H9V18Z" fill="#2d623e"/>

  <!-- Numeral Romano II en carmesí intenso (estilo secuela Graveyard Keeper) -->
  <!-- Pilar I izquierdo -->
  <g id="numeral-i-left">
    <!-- Base / serifs -->
    <path d="M6 5H13V8H11V21H13V24H6V21H8V8H6V5Z" fill="#e11d48"/>
    <!-- Relieve sombra inferior/derecha -->
    <path d="M11 8H13V21H11V8ZM6 21H13V24H6V21Z" fill="#881337"/>
    <!-- Filo luminoso / bisel -->
    <path d="M6 5H13V6.5H8.5V21H7V8H6V5Z" fill="#fecdd3"/>
    <rect x="8.5" y="6.5" width="1.5" height="15" fill="#f43f5e"/>
  </g>

  <!-- Pilar I derecho -->
  <g id="numeral-i-right">
    <!-- Base / serifs -->
    <path d="M19 5H26V8H24V21H26V24H19V21H21V8H19V5Z" fill="#e11d48"/>
    <!-- Relieve sombra inferior/derecha -->
    <path d="M24 8H26V21H24V8ZM19 21H26V24H19V21Z" fill="#881337"/>
    <!-- Filo luminoso / bisel -->
    <path d="M19 5H26V6.5H21.5V21H20V8H19V5Z" fill="#fecdd3"/>
    <rect x="21.5" y="6.5" width="1.5" height="15" fill="#f43f5e"/>
  </g>
</svg>