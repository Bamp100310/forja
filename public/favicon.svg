<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Placa base de hierro forjado oscuro -->
  <rect x="0" y="0" width="32" height="32" rx="4" fill="#090e0c"/>
  <!-- Marco biselado de latón industrial y cobre -->
  <rect x="1" y="1" width="30" height="30" rx="3" fill="#78350f"/>
  <rect x="2" y="2" width="28" height="28" rx="2" fill="#d97706"/>
  <rect x="3" y="3" width="26" height="26" fill="#111b17"/>
  <!-- Fondo interior de cámara de fragua -->
  <rect x="4" y="4" width="24" height="24" fill="#0c1411"/>

  <!-- Remaches de esquina en acero y bronce -->
  <rect x="4" y="4" width="2" height="2" fill="#fbbf24"/>
  <rect x="26" y="4" width="2" height="2" fill="#fbbf24"/>
  <rect x="4" y="26" width="2" height="2" fill="#d97706"/>
  <rect x="26" y="26" width="2" height="2" fill="#d97706"/>

  <!-- Resplandor térmico de fragua detrás de los pilares III -->
  <rect x="8" y="6" width="16" height="10" fill="#431407" opacity="0.75"/>

  <!-- Numeral Romano III integrado como tres lingotes/pilares incandescentes sobre el yunque -->
  <!-- Pilar I (Izquierdo) -->
  <rect x="8" y="6" width="3" height="1" fill="#fde047"/>
  <rect x="9" y="7" width="2" height="7" fill="#f59e0b"/>
  <rect x="8" y="7" width="1" height="7" fill="#ea580c"/>
  <rect x="8" y="14" width="3" height="1" fill="#b45309"/>

  <!-- Pilar II (Central, más alto con chispa) -->
  <rect x="14" y="5" width="4" height="1" fill="#fef08a"/>
  <rect x="15" y="6" width="2" height="8" fill="#fbbf24"/>
  <rect x="14" y="6" width="1" height="8" fill="#ea580c"/>
  <rect x="17" y="6" width="1" height="8" fill="#d97706"/>
  <rect x="14" y="14" width="4" height="1" fill="#b45309"/>

  <!-- Pilar III (Derecho) -->
  <rect x="21" y="6" width="3" height="1" fill="#fde047"/>
  <rect x="21" y="7" width="2" height="7" fill="#f59e0b"/>
  <rect x="23" y="7" width="1" height="7" fill="#d97706"/>
  <rect x="21" y="14" width="3" height="1" fill="#b45309"/>

  <!-- Yunque pesado de herrero (Base estructural de FORJA III) -->
  <!-- Mesa superior del yunque y cuerno izquierdo -->
  <rect x="5" y="17" width="3" height="2" fill="#94a3b8"/>
  <rect x="8" y="16" width="18" height="1" fill="#e2e8f0"/>
  <rect x="8" y="17" width="19" height="3" fill="#94a3b8"/>
  <rect x="8" y="19" width="18" height="1" fill="#64748b"/>
  <!-- Cintura del yunque con acento de cobre -->
  <rect x="11" y="20" width="10" height="3" fill="#475569"/>
  <rect x="12" y="21" width="8" height="1" fill="#f59e0b"/>
  <!-- Zócalo pesado del yunque -->
  <rect x="8" y="23" width="16" height="2" fill="#64748b"/>
  <rect x="7" y="25" width="18" height="2" fill="#334155"/>

  <!-- Chispas ascendentes de forja -->
  <rect x="6" y="11" width="1" height="1" fill="#fde047"/>
  <rect x="25" y="10" width="1" height="1" fill="#fb923c"/>
</svg>